<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptSee - AI Vision Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>PromptSee</h1>
    </header>
    
    <div class="video-wrapper">
      <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
      <input id="prompt" type="text" placeholder="Ask about what you see..." value="What do you see?">
      <button id="capture">Analyze</button>
    </div>

    <div id="result-card" class="result-card">
      <h3>AI Analysis</h3>
      <p id="reply">Waiting for input...</p>
    </div>
  </div>

  <footer>
    Powered by FastAPI & Transformers
  </footer>

  <script src="script.js"></script>
</body>
</html>
